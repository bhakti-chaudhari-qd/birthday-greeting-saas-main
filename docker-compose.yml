services:
  app:
    build: .
    container_name: birthday-greeting
    restart: unless-stopped
    # Host networking so the container reaches the VPS's own Postgres at
    # localhost:5432 (same DATABASE_URL already in .env) without any
    # bridge/port-mapping changes, and keeps serving on :3001 exactly like
    # the pm2 setup nginx already proxies to.
    network_mode: host
    env_file:
      - .env
    # Host networking would otherwise publish :3001 on every interface.
    # Listen on loopback only, so the app is reachable through nginx alone
    # (TLS, body limits, and the X-Forwarded-For the rate limiter relies on).
    environment:
      HOSTNAME: 127.0.0.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
